services:
  codstun:
    image: codstun:${CODSTUN_REVISION:?set the deployed commit SHA}
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CODSTUN_REVISION: ${CODSTUN_REVISION:?set the deployed commit SHA}
    command:
      - --public-ip
      - ${CODSTUN_PUBLIC_IP:?set the public IPv4 address in the private env file}
      - --mode
      - ${CODSTUN_MODE:-relay}
      - --direct-window
      - ${CODSTUN_DIRECT_WINDOW:-1.0}
      - --relay-ports
      - ${CODSTUN_RELAY_PORTS:-20000-20199}
      - --event-log
      - /var/lib/codstun/events.jsonl
      - --event-log-bytes
      - ${CODSTUN_LOG_BYTES:-20971520}
      - --event-log-backups
      - ${CODSTUN_LOG_BACKUPS:-10}
      - --traffic-interval
      - ${CODSTUN_TRAFFIC_INTERVAL:-10}
      - --packet-samples
      - ${CODSTUN_PACKET_SAMPLES:-8}
    volumes:
      - ${CODSTUN_LOG_DIR:-/opt/codstun/shared/logs}:/var/lib/codstun
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: [CMD, python, -m, codstun.health]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
