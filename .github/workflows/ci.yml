name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test protocol, relay, health check and deployment decisions
        run: python3 -m unittest discover -s tests -v
      - name: Build runtime image
        run: docker build --tag codstun:ci .
      - name: Exercise adaptive mode in the runtime container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f codstun-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name codstun-ci --network host codstun:ci \
            --public-ip 127.0.0.1 --bind 127.0.0.1 --mode adaptive \
            --relay-ports 22000-22199 --direct-window 0.25
          for attempt in {1..30}; do
            if docker exec codstun-ci python -m codstun.health; then break; fi
            sleep 0.2
          done
          docker exec codstun-ci python -m codstun.health
          python3 scripts/probe.py 127.0.0.1 --adaptive --timeout 0.1
          python3 scripts/smoke_adaptive.py 127.0.0.1 --relay-ports 22000-22199
